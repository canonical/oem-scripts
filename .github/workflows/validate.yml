name: Validate oem-scripts

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, oem-enablement, amd64, noble, medium]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install validation dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            acl autopkgtest cloud-image-utils distro-info qemu-system-x86 qemu-utils

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo 'Error: this runner does not expose /dev/kvm' >&2
            exit 1
          fi
          sudo setfacl --modify "u:$(id --user):rw" /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Run isolated autopkgtests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/autopkgtest-home"
          set +e
          HOME="$RUNNER_TEMP/autopkgtest-home" ./run-autopkgtest qemu resolute
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            exit "$status"
          fi
