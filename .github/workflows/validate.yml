name: Validate oem-scripts

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      - 'debian/changelog'
      - 'debian/copyright'
      - 'README.md'
      - 'Dockerfile'
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'
      # Docs and release metadata only; the tag build validates release commits.
      - 'debian/changelog'
      - 'debian/copyright'
      - 'README.md'
      - 'Dockerfile'

jobs:
  validate:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Run autopkgtests
        uses: ./.github/actions/autopkgtest

      - name: Build Debian artifacts
        run: |
          set -euo pipefail
          BUILD_PARENT="$RUNNER_TEMP/debian-build"
          BUILD_SOURCE="$BUILD_PARENT/source"
          rm -rf "$BUILD_PARENT"
          mkdir -p "$BUILD_SOURCE"
          git archive --format=tar HEAD |
            tar --extract --directory "$BUILD_SOURCE"

          (
            cd "$BUILD_SOURCE"
            dpkg-buildpackage -us -uc -tc
            dpkg-buildpackage -S -us -uc
          )

          VERSION=$(dpkg-parsechangelog --show-field Version)
          shopt -s nullglob
          source_tar=("$BUILD_PARENT/oem-scripts_${VERSION}".tar.*)
          [ "${#source_tar[@]}" -eq 1 ]
          tar --list --file "${source_tar[0]}" > "$RUNNER_TEMP/source-tar-contents"
          if grep -F 'autopkgtest-build-' "$RUNNER_TEMP/source-tar-contents"; then
            echo 'Generated autopkgtest output was included in the source package.' >&2
            exit 1
          fi